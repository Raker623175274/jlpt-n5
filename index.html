<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<title>JLPT N5 日本語学習</title>
<style>
:root {
  --bg: #f9f6f0;
  --card: #ffffff;
  --primary: #c0392b;
  --primary-light: #e74c3c;
  --accent: #e67e22;
  --success: #27ae60;
  --text: #2c3e50;
  --muted: #7f8c8d;
  --border: #e8e0d5;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Segoe UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.container { max-width: 800px; margin: 0 auto; padding: 16px; }

/* Header */
.header {
  text-align: center;
  padding: 24px 16px 16px;
  background: linear-gradient(135deg, #c0392b, #8e1e1e);
  color: #fff;
  border-radius: 0 0 var(--radius) var(--radius);
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.5px; }
.header .subtitle { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
.profile-bar { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; }
.profile-select { padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); color: #fff; font-size: 0.8rem; cursor: pointer; max-width: 160px; }
.profile-select option { color: #2c3e50; }
.profile-add-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); color: #fff; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.profile-add-btn:hover { background: rgba(255,255,255,0.3); }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 4px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  position: sticky;
  top: 8px;
  z-index: 10;
}
.tab {
  flex: 1;
  padding: 10px 8px;
  border: none;
  background: transparent;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  transition: all 0.2s;
  white-space: nowrap;
}
.tab:hover { color: var(--text); background: #f5f0e8; }
.tab.active { background: var(--primary); color: #fff; }

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.card h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; gap: 8px; }

/* Category Filter */
.category-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.cat-btn {
  padding: 6px 14px;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text);
  transition: all 0.2s;
}
.cat-btn:hover { border-color: var(--primary); color: var(--primary); }
.cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Vocab Cards */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.vocab-card {
  background: #fefefe;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.vocab-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--primary-light); }
.vocab-card.flipped .vocab-back { display: block; }
.vocab-card .kanji { font-size: 1.4rem; font-weight: 700; color: var(--text); }
.vocab-card .kana { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.vocab-card .meaning { font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 4px; }
.speak-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--card); cursor: pointer; font-size: 0.9rem;
  transition: all 0.2s; vertical-align: middle; margin-left: 4px;
}
.speak-btn:hover { border-color: var(--primary); background: #fff5f5; transform: scale(1.1); }
.speak-btn.speaking { border-color: var(--accent); background: #fff8e1; animation: pulse 0.6s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.vocab-card .example { font-size: 0.75rem; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); display: none; }
.vocab-card.expanded .example { display: block; }
.vocab-card .studied-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 0.7rem;
  background: var(--success);
  color: #fff;
  padding: 2px 8px;
  border-radius: 10px;
  display: none;
}
.vocab-card.studied .studied-badge { display: block; }

/* Grammar */
.grammar-list { display: flex; flex-direction: column; gap: 10px; }
.grammar-item {
  background: #fefefe;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.grammar-item:hover { box-shadow: var(--shadow); border-color: var(--accent); }
.grammar-item .pattern { font-size: 1.15rem; font-weight: 700; color: var(--primary); }
.grammar-item .g-meaning { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-top: 2px; }
.grammar-item .g-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 0.85rem; }
.grammar-item.expanded .g-detail { display: block; }
.grammar-item .g-example { background: #f9f6f0; padding: 10px; border-radius: 8px; margin-top: 8px; }
.grammar-item .g-example .jp { color: var(--text); }
.grammar-item .g-example .cn { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }

/* Quiz */
.quiz-setup { margin-bottom: 16px; }
.quiz-setup label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
.quiz-setup select {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 0.9rem;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
}
.quiz-question {
  background: linear-gradient(135deg, #fef9f0, #fdf6e8);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  margin-bottom: 12px;
}
.quiz-question .q-prompt { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.quiz-question .q-text { font-size: 1.8rem; font-weight: 700; color: var(--text); }
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.quiz-option {
  padding: 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 500;
  transition: all 0.2s;
  text-align: center;
}
.quiz-option:hover { border-color: var(--primary-light); background: #fff5f5; }
.quiz-option.correct { border-color: var(--success); background: #eafaf1; color: var(--success); }
.quiz-option.wrong { border-color: #e74c3c; background: #fdedec; color: #e74c3c; }
.quiz-option:disabled { pointer-events: none; }
.quiz-result {
  margin-top: 12px;
  padding: 16px;
  border-radius: 10px;
  text-align: center;
  display: none;
}
.quiz-result.show { display: block; }
.quiz-result.correct-r { background: #eafaf1; border: 1px solid var(--success); }
.quiz-result.wrong-r { background: #fdedec; border: 1px solid #e74c3c; }
.quiz-result .result-icon { font-size: 1.5rem; }
.quiz-result .explanation { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
.next-btn {
  display: block;
  margin: 12px auto 0;
  padding: 10px 32px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 25px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.next-btn:hover { background: var(--primary-light); transform: translateY(-1px); }

/* Progress */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.stat-card .stat-num { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
.stat-card .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.progress-bar-wrap { background: #e8e0d5; border-radius: 8px; height: 10px; margin-top: 8px; overflow: hidden; }
.progress-bar-fill { background: linear-gradient(90deg, var(--primary), var(--accent)); height: 100%; border-radius: 8px; transition: width 0.5s; }
.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.history-item:last-child { border-bottom: none; }
.reset-btn {
  display: block;
  margin: 16px auto 0;
  padding: 8px 24px;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}
.reset-btn:hover { color: #e74c3c; border-color: #e74c3c; }

/* Misc */
.section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-title span.count { font-size: 0.8rem; color: var(--muted); }
.empty-state { text-align: center; padding: 32px; color: var(--muted); }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }
.search-input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 0.9rem;
  margin-bottom: 12px;
  background: var(--card);
}
.search-input:focus { outline: none; border-color: var(--primary); }
.flashcard-mode .vocab-card { min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }

@media (max-width: 480px) {
  .header h1 { font-size: 1.3rem; }
  .vocab-grid { grid-template-columns: 1fr 1fr; }
  .quiz-options { grid-template-columns: 1fr; }
  .tabs { gap: 2px; }
  .tab { font-size: 0.75rem; padding: 8px 4px; }
}

/* Auth Overlay */
.auth-overlay {
  position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.auth-card {
  background: #fff; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
}
.auth-card h2 { font-size: 1.3rem; color: #c0392b; margin-bottom: 4px; }
.auth-card .sub { font-size: 0.8rem; color: #7f8c8d; margin-bottom: 20px; }
.auth-card input {
  width: 100%; padding: 12px 14px; border: 1.5px solid #e0d8cc; border-radius: 10px;
  font-size: 0.9rem; margin-bottom: 10px; background: #faf7f2;
}
.auth-card input:focus { outline: none; border-color: #c0392b; }
.auth-btn {
  width: 100%; padding: 12px; background: #c0392b; color: #fff; border: none;
  border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  transition: all 0.2s; margin-top: 6px;
}
.auth-btn:hover { background: #e74c3c; }
.auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.auth-switch { font-size: 0.8rem; color: #7f8c8d; margin-top: 14px; }
.auth-switch span { color: #c0392b; cursor: pointer; font-weight: 600; }
.auth-error { color: #e74c3c; font-size: 0.78rem; margin-top: 6px; display: none; }
.auth-success { color: #27ae60; font-size: 0.78rem; margin-top: 6px; display: none; }
.logout-btn {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem;
  cursor: pointer; transition: all 0.2s;
}
.logout-btn:hover { background: rgba(255,255,255,0.25); }
.header-row { display: flex; justify-content: space-between; align-items: flex-start; }
.header-row .user-info { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }
.loading-spinner {
  display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Auth Overlay -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-card">
    <h2>📚 JLPT N5 学习平台</h2>
    <div class="sub" id="auth-subtitle">登录以同步学习进度</div>
    <input type="email" id="auth-email" placeholder="邮箱地址" autocomplete="email">
    <input type="password" id="auth-password" placeholder="密码（至少6位）" autocomplete="current-password">
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-success" id="auth-success"></div>
    <button class="auth-btn" id="auth-btn" onclick="handleAuth()">登 录</button>
    <div class="auth-switch">
      <span id="auth-switch-text">还没有账号？</span>
      <span id="auth-switch-link" onclick="toggleAuthMode()" style="cursor:pointer;color:#c0392b;font-weight:600;">立即注册</span>
    </div>
  </div>
</div>

<div id="app-main" style="display:none;">
<div class="container">
  <div class="header">
    <h1>📚 JLPT N5 日本語学習</h1>
    <div class="subtitle">词汇 · 语法 · 习题 · 进度追踪</div>
  <div class="profile-bar">
    <select id="profile-select" onchange="switchProfile(this.value)" class="profile-select"></select>
    <button onclick="addProfile()" class="profile-add-btn" title="添加学习者">＋</button>
  </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="vocab">📝 词汇</button>
    <button class="tab" data-tab="grammar">📖 语法</button>
    <button class="tab" data-tab="quiz">✏️ 习题</button>
    <button class="tab" data-tab="progress">📊 进度</button>
  </div>

  <div id="tab-content"></div>
</div>

<script>
// ==================== DATA ====================
const VOCAB = [
  // People / 人
  { kanji:"私", kana:"わたし", meaning:"我", cat:"人", ex:"私は学生です。", ex_cn:"我是学生。" },
  { kanji:"あなた", kana:"あなた", meaning:"你", cat:"人", ex:"あなたは先生ですか。", ex_cn:"你是老师吗？" },
  { kanji:"彼", kana:"かれ", meaning:"他；男朋友", cat:"人", ex:"彼は日本人です。", ex_cn:"他是日本人。" },
  { kanji:"彼女", kana:"かのじょ", meaning:"她；女朋友", cat:"人", ex:"彼女は優しいです。", ex_cn:"她很温柔。" },
  { kanji:"父", kana:"ちち", meaning:"（我的）父亲", cat:"人", ex:"父は会社員です。", ex_cn:"我父亲是公司职员。" },
  { kanji:"母", kana:"はは", meaning:"（我的）母亲", cat:"人", ex:"母は料理が上手です。", ex_cn:"我母亲很会做饭。" },
  { kanji:"友達", kana:"ともだち", meaning:"朋友", cat:"人", ex:"友達と遊びます。", ex_cn:"和朋友一起玩。" },
  { kanji:"先生", kana:"せんせい", meaning:"老师", cat:"人", ex:"先生、おはようございます。", ex_cn:"老师早上好。" },
  { kanji:"学生", kana:"がくせい", meaning:"学生", cat:"人", ex:"私は学生です。", ex_cn:"我是学生。" },
  { kanji:"家族", kana:"かぞく", meaning:"家人；家庭", cat:"人", ex:"家族は四人です。", ex_cn:"我家有四口人。" },
  { kanji:"子供", kana:"こども", meaning:"小孩", cat:"人", ex:"子供が二人います。", ex_cn:"有两个小孩。" },
  // Objects / 物
  { kanji:"本", kana:"ほん", meaning:"书", cat:"物", ex:"この本は面白いです。", ex_cn:"这本书很有趣。" },

  { kanji:"鞄", kana:"かばん", meaning:"包", cat:"物", ex:"この鞄は重いです。", ex_cn:"这个包很重。" },

  { kanji:"今日", kana:"きょう", meaning:"今天", cat:"時間", ex:"今日は金曜日です。", ex_cn:"今天是星期五。" },

  { kanji:"昼", kana:"ひる", meaning:"中午", cat:"時間", ex:"昼休みは12時です。", ex_cn:"午休是12点。" },

let authMode = 'login';

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('auth-btn').textContent = authMode === 'login' ? '登 录' : '注 册';
  document.getElementById('auth-subtitle').textContent = authMode === 'login' ? '登录以同步学习进度' : '创建账号开始学习';
  document.getElementById('auth-switch-text').textContent = authMode === 'login' ? '还没有账号？' : '已有账号？';
  document.getElementById('auth-switch-link').textContent = authMode === 'login' ? '立即注册' : '去登录';
  document.getElementById('auth-error').style.display = 'none';
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('auth-success').style.display = 'none';
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!email || !password) { showAuthError('请填写邮箱和密码'); return; }
  if (password.length < 6) { showAuthError('密码至少需要6位'); return; }
  const btn = document.getElementById('auth-btn');
  btn.disabled = true; btn.textContent = '请稍候...';
  let result;
  if (authMode === 'login') {
    result = await supabase.auth.signInWithPassword({ email, password });
  } else {
    result = await supabase.auth.signUp({ email, password });
  }
  if (result.error) {
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? '登 录' : '注 册';
    if (result.error.message.includes('Invalid login')) {
      showAuthError('邮箱或密码错误');
    } else if (result.error.message.includes('already registered')) {
      showAuthError('该邮箱已注册，请直接登录');
      authMode = 'login'; toggleAuthMode(); toggleAuthMode();
    } else {
      showAuthError(result.error.message);
    }
    return;
  }
  if (authMode === 'register') {
    document.getElementById('auth-success').style.display = 'block';
    document.getElementById('auth-success').textContent = '✅ 注册成功！正在登录...';
    document.getElementById('auth-error').style.display = 'none';
    await new Promise(r => setTimeout(r, 800));
    const loginResult = await supabase.auth.signInWithPassword({ email, password });
    if (loginResult.error) { showAuthError('自动登录失败，请手动登录'); btn.disabled = false; btn.textContent = '登 录'; return; }
  }
  onAuthenticated();
}

async function onAuthenticated() {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('app-main').style.display = 'block';
  await loadProgressFromServer();
  renderVocab();
  const { data: { user } } = await supabase.auth.getUser();
  document.getElementById('user-email-display').textContent = user?.email || '';
}

async function handleLogout() {
  await supabase.auth.signOut();
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('app-main').style.display = 'none';
  document.getElementById('auth-email').value = '';
  document.getElementById('auth-password').value = '';
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-btn').disabled = false;
  document.getElementById('auth-btn').textContent = '登 录';
  authMode = 'login'; toggleAuthMode(); toggleAuthMode();
}

// ==================== PROGRESS MANAGER (Supabase) ====================
const DATA_VERSION = 1;
let progress = createEmptyProgress();

function createEmptyProgress() {
  return { version: DATA_VERSION, vocabStudied:{}, grammarStudied:{}, quizHistory:[], streak:{count:0,lastDate:null} };
}

async function loadProgressFromServer() {
  try {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { progress = createEmptyProgress(); return; }
    const { data, error } = await supabase
      .from('user_progress')
      .select('progress_data')
      .eq('user_id', user.id)
      .single();
    if (data && data.progress_data) {
      progress = data.progress_data;
      if (!progress.version) { progress.version = DATA_VERSION; await saveProgressToServer(); }
    } else {
      progress = createEmptyProgress();
      await supabase.from('user_progress').insert({ user_id: user.id, progress_data: progress });
    }
  } catch(e) {
    console.error('Failed to load progress:', e);
    progress = createEmptyProgress();
  }
}

let saveTimeout = null;
function saveProgressToServer() {
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;
      progress.version = DATA_VERSION;
      await supabase
        .from('user_progress')
        .upsert({ user_id: user.id, progress_data: progress, updated_at: new Date().toISOString() });
    } catch(e) { console.error('Failed to save progress:', e); }
  }, 1000);
}
function saveProgressNow() {
  if (saveTimeout) { clearTimeout(saveTimeout); saveTimeout = null; }
  saveProgressToServer();
}

function markVocabStudied(kanji) {
  progress.vocabStudied[kanji] = true;
  saveProgressToServer();
}
function markGrammarStudied(pattern) {
  progress.grammarStudied[pattern] = true;
  saveProgressToServer();
}
function addQuizResult(type, score, total) {
  progress.quizHistory.push({ date: new Date().toISOString(), type, score, total });
  const today = new Date().toISOString().slice(0,10);
  if (progress.streak.lastDate === today) { saveProgressToServer(); return; }
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if (progress.streak.lastDate === yesterday) { progress.streak.count++; }
  else { progress.streak.count = 1; }
  progress.streak.lastDate = today;
  saveProgressNow();
}
async function resetProgress() {
  progress = createEmptyProgress();
  await saveProgressNow();
}
function getVocabStats() {
  const total = VOCAB.length;
  const studied = Object.keys(progress.vocabStudied).length;
  return { total, studied, pct: total ? Math.round(studied/total*100) : 0 };
}
function getGrammarStats() {
  const total = GRAMMAR.length;
  const studied = Object.keys(progress.grammarStudied).length;
  return { total, studied, pct: total ? Math.round(studied/total*100) : 0 };
}
function getQuizStats() {
  const h = progress.quizHistory;
  if (!h.length) return { total: 0, totalCorrect: 0, avgPct: 0 };
  let correct = 0, total = 0;
  h.forEach(q => { correct += q.score; total += q.total; });
  return { total: h.length, totalCorrect: correct, totalQ: total, avgPct: Math.round(correct/total*100) };
}

function toggleVocabCard(el, kanji) {
  el.classList.toggle('expanded');
  if (!progress.vocabStudied[kanji]) {
    markVocabStudied(kanji);
    el.classList.add('studied');
  }
}

// --- Grammar Tab ---
function renderGrammar() {
  let filtered = GRAMMAR;
  if (grammarSearch) {
    const q = grammarSearch.toLowerCase();
    filtered = GRAMMAR.filter(g => g.pattern.toLowerCase().includes(q) || g.meaning.toLowerCase().includes(q) || g.detail.toLowerCase().includes(q));
  }
  let html = '<div class="card"><h2>📖 N5 文法</h2>';
  html += '<input class="search-input" type="text" placeholder="🔍 搜索语法..." value="' + grammarSearch + '" oninput="grammarSearchFn(this.value)">';
  html += '<div class="section-title"><span class="count">共 ' + filtered.length + ' 个文法 | 点击展开详解</span></div>';
  html += '<div class="grammar-list">';
  filtered.forEach(g => {
    const studied = progress.grammarStudied[g.pattern] ? ' ✓已学' : '';
    html += `<div class="grammar-item" onclick="toggleGrammarItem(this, '${g.pattern.replace(/'/g,"\\'")}')">
      <div class="pattern">${g.pattern}${studied}</div>
      <div class="g-meaning">${g.meaning}</div>
      <div class="g-detail">
        <p>${g.detail}</p>
        <div class="g-example"><div class="jp">${g.ex_jp}</div><div class="cn">${g.ex_cn}</div></div>
      </div>
    </div>`;
  });
  html += '</div></div>';
  $content.innerHTML = html;
}
function grammarSearchFn(q) { grammarSearch = q; renderGrammar(); }
function toggleGrammarItem(el, pattern) {
  el.classList.toggle('expanded');
  if (!progress.grammarStudied[pattern]) {
    markGrammarStudied(pattern);
    el.querySelector('.pattern').textContent = pattern + ' ✓已学';
  }
}

// --- Quiz Tab ---
function renderQuiz() {
  let html = '<div class="card"><h2>✏️ 习题练习</h2>';
  html += '<div class="quiz-setup">';
  html += '<label>选择题型</label>';
  html += '<select id="quiz-type" onchange="startQuiz()">';
  html += '<option value="vocab-ja2cn">词汇：看日语选中文释义</option>';
  html += '<option value="vocab-cn2ja">词汇：看中文选日语</option>';
  html += '<option value="grammar-fill">语法：选择正确文法</option>';
  html += '<option value="grammar-particle">语法：选择正确助词</option>';
  html += '<option value="mixed">综合混合</option>';
  html += '</select>';
  html += '<label style="margin-top:10px;">题目数量</label>';
  html += '<select id="quiz-count" onchange="startQuiz()">';
  html += '<option value="5">5 题</option>';
  html += '<option value="10" selected>10 题</option>';
  html += '<option value="15">15 题</option>';
  html += '<option value="20">20 题</option>';
  html += '</select>';
  html += '</div>';
  html += '<div id="quiz-area">';
  html += '<div class="empty-state"><div class="icon">🎯</div><p>选择题型后自动开始</p></div>';
  html += '</div></div>';
  $content.innerHTML = html;
  startQuiz();
}

function startQuiz() {
  const type = document.getElementById('quiz-type')?.value || 'vocab-ja2cn';
  quizState = generateQuiz(type);
  renderQuizQuestion();
}
function generateQuiz(type) {
  const questions = [];
  const n = parseInt(document.getElementById('quiz-count')?.value || '10');
  if (type === 'vocab-ja2cn') {
    const pool = [...VOCAB].sort(() => Math.random()-0.5).slice(0, n);
    pool.forEach(v => {
      const wrong = VOCAB.filter(x => x.kanji !== v.kanji).sort(() => Math.random()-0.5).slice(0, 3);
      const options = [v, ...wrong].sort(() => Math.random()-0.5);
      questions.push({
        prompt: '这个词是什么意思？',
        text: v.kanji + '（' + v.kana + '）',
        options: options.map(o => o.meaning),
        correct: options.indexOf(v),
        explanation: v.kanji + ' = ' + v.meaning + '。' + (v.ex ? '例句：' + v.ex + '（' + v.ex_cn + '）' : ''),
        type: 'vocab-ja2cn'
      });
    });
  } else if (type === 'vocab-cn2ja') {
    const pool = [...VOCAB].sort(() => Math.random()-0.5).slice(0, n);
    pool.forEach(v => {
      const wrong = VOCAB.filter(x => x.kanji !== v.kanji).sort(() => Math.random()-0.5).slice(0, 3);
      const options = [v, ...wrong].sort(() => Math.random()-0.5);
      questions.push({
        prompt: '选出对应的日语',
        text: v.meaning,
        options: options.map(o => o.kanji + '（' + o.kana + '）'),
        correct: options.indexOf(v),
        explanation: v.meaning + ' = ' + v.kanji + '（' + v.kana + '）。' + (v.ex ? '例句：' + v.ex + '（' + v.ex_cn + '）' : ''),
        type: 'vocab-cn2ja'
      });
    });
  } else if (type === 'grammar-fill') {
    const pool = [...GRAMMAR].sort(() => Math.random()-0.5).slice(0, n);
    pool.forEach(g => {
      const wrong = GRAMMAR.filter(x => x.pattern !== g.pattern).sort(() => Math.random()-0.5).slice(0, 3);
      const options = [g, ...wrong].sort(() => Math.random()-0.5);
      questions.push({
        prompt: '这个句型的意思是？',
        text: g.pattern,
        options: options.map(o => o.meaning),
        correct: options.indexOf(g),
        explanation: g.pattern + ' = ' + g.meaning + '。' + g.detail + ' 例句：' + g.ex_jp + '（' + g.ex_cn + '）',
        type: 'grammar-fill'
      });
    });
  } else if (type === 'grammar-particle') {
    const particleQs = [
      { text:'私___学生です。', prompt:'填入正确的助词', options:['は','が','を','に'], correct:0, explanation:'「は」提示主题。私「は」学生です = 我是学生。' },
      { text:'本___読みます。', prompt:'填入正确的助词', options:['が','を','に','で'], correct:1, explanation:'「を」标记宾语。本「を」読みます = 读书。' },
      { text:'学校___行きます。', prompt:'填入正确的助词', options:['を','で','に','が'], correct:2, explanation:'「に」表示目的地。学校「に」行きます = 去学校。' },
      { text:'バス___行きます。', prompt:'填入正确的助词', options:['に','を','で','が'], correct:2, explanation:'「で」表示手段。バス「で」行きます = 坐公交去。' },
      { text:'パン___牛乳を買います。', prompt:'填入正确的助词', options:['に','で','と','が'], correct:2, explanation:'「と」表示并列。パン「と」牛乳 = 面包和牛奶。' },
      { text:'9時___勉強します。', prompt:'填入正确的助词', options:['に','で','を','と'], correct:0, explanation:'时间点用「に」。9時「に」勉強します = 9点学习。' },
      { text:'公園___散歩します。', prompt:'填入正确的助词', options:['に','を','で','が'], correct:1, explanation:'移动的路径用「を」。公園「を」散歩します = 在公园散步。' },
      { text:'駅___歩きます。', prompt:'填入正确的助词', options:['に','を','で','まで'], correct:3, explanation:'「まで」表示终点。駅「まで」歩きます = 走到车站。' },
      { text:'部屋___綺麗です。', prompt:'填入正确的助词', options:['が','は','を','に'], correct:1, explanation:'「は」提示主题。部屋「は」綺麗です = 房间很漂亮。' },
      { text:'日本語___話せますか。', prompt:'填入正确的助词', options:['は','に','を','が'], correct:3, explanation:'能力对象用「が」。日本語「が」話せますか = 会说日语吗？' },
    ];
    const pool = particleQs.sort(() => Math.random()-0.5).slice(0, n);
    pool.forEach(q => { q.type = 'grammar-particle'; questions.push(q); });
  } else if (type === 'mixed') {
    // Mix vocab and grammar
    const vPool = [...VOCAB].sort(() => Math.random()-0.5).slice(0, 5);
    const gPool = [...GRAMMAR].sort(() => Math.random()-0.5).slice(0, 5);
    vPool.forEach(v => {
      const wrong = VOCAB.filter(x => x.kanji !== v.kanji).sort(() => Math.random()-0.5).slice(0, 3);
      const options = [v, ...wrong].sort(() => Math.random()-0.5);
      questions.push({
        prompt: '这个词是什么意思？',
        text: v.kanji + '（' + v.kana + '）',
        options: options.map(o => o.meaning),
        correct: options.indexOf(v),
        explanation: v.kanji + ' = ' + v.meaning + '。',
        type: 'mixed'
      });
    });
    gPool.forEach(g => {
      const wrong = GRAMMAR.filter(x => x.pattern !== g.pattern).sort(() => Math.random()-0.5).slice(0, 3);
      const options = [g, ...wrong].sort(() => Math.random()-0.5);
      questions.push({
        prompt: '这个句型的意思是？',
        text: g.pattern,
        options: options.map(o => o.meaning),
        correct: options.indexOf(g),
        explanation: g.pattern + ' = ' + g.meaning + '。' + g.detail,
        type: 'mixed'
      });
    });
  }
  return { questions, current: 0, score: 0, answered: false, type };
}
function renderQuizQuestion() {
  if (!quizState) { startQuiz(); return; }
  const q = quizState.questions[quizState.current];
  const area = document.getElementById('quiz-area');
  if (!area) return;
  const pct = Math.round((quizState.current) / quizState.questions.length * 100);
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <span style="font-weight:600;">第 ${quizState.current+1} / ${quizState.questions.length} 题</span>
    <span style="color:var(--muted);font-size:0.8rem;">得分: ${quizState.score}</span>
  </div>`;
  html += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+pct+'%"></div></div>';
  html += `<div class="quiz-question"><div class="q-prompt">${q.prompt}</div><div class="q-text">${q.text}</div></div>`;
  html += '<div class="quiz-options">';
  q.options.forEach((opt, i) => {
    html += `<button class="quiz-option" data-idx="${i}" onclick="answerQuiz(${i})">${opt}</button>`;
  });
  html += '</div><div class="quiz-result" id="quiz-result"></div>';
  area.innerHTML = html;
  quizState.answered = false;
}
function answerQuiz(idx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const q = quizState.questions[quizState.current];
  const isCorrect = idx === q.correct;
  if (isCorrect) quizState.score++;

  // Highlight options
  const opts = document.querySelectorAll('.quiz-option');
  opts.forEach((o, i) => {
    o.disabled = true;
    if (i === q.correct) o.classList.add('correct');
    else if (i === idx && !isCorrect) o.classList.add('wrong');
  });

  // Show result
  const resultDiv = document.getElementById('quiz-result');
  resultDiv.className = 'quiz-result show ' + (isCorrect ? 'correct-r' : 'wrong-r');
  resultDiv.innerHTML = `<div class="result-icon">${isCorrect ? '✅ 正解！' : '❌ 不正确'}</div>
    <div class="explanation">${q.explanation}</div>`;

  // Next button
  if (quizState.current < quizState.questions.length - 1) {
    resultDiv.innerHTML += `<button class="next-btn" onclick="nextQuestion()">下一题 →</button>`;
  } else {
    resultDiv.innerHTML += `<button class="next-btn" onclick="finishQuiz()">查看结果 🎉</button>`;
  }
}
function nextQuestion() {
  quizState.current++;
  renderQuizQuestion();
}
function finishQuiz() {
  addQuizResult(quizState.type, quizState.score, quizState.questions.length);
  const area = document.getElementById('quiz-area');
  const pct = Math.round(quizState.score / quizState.questions.length * 100);
  let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '👍' : pct >= 50 ? '📚' : '💪';
  area.innerHTML = `<div class="quiz-result show correct-r" style="display:block;">
    <div class="result-icon" style="font-size:3rem;">${emoji}</div>
    <h3 style="margin:8px 0;">${pct}%</h3>
    <p>答对 ${quizState.score} / ${quizState.questions.length} 题</p>
    <p style="font-size:0.8rem;color:var(--muted);">进度已自动保存</p>
    <button class="next-btn" onclick="startQuiz()">再练一组 🔄</button>
  </div>`;
}

// --- Progress Tab ---
function renderProgress() {
  const vs = getVocabStats();
  const gs = getGrammarStats();
  const qs = getQuizStats();
  let html = '<div class="card"><h2>📊 学习进度</h2>';
  html += '<div class="stats-grid">';
  html += `<div class="stat-card"><div class="stat-num">${progress.streak.count || 0}</div><div class="stat-label">🔥 连续学习天数</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${vs.studied}/${vs.total}</div><div class="stat-label">📝 已学词汇</div><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${vs.pct}%"></div></div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${gs.studied}/${gs.total}</div><div class="stat-label">📖 已学文法</div><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${gs.pct}%"></div></div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${qs.total}</div><div class="stat-label">✏️ 练习次数</div></div>`;
  html += `<div class="stat-card"><div class="stat-num">${qs.avgPct}%</div><div class="stat-label">🎯 平均正确率</div></div>`;
  html += '</div>';

  // Quiz history
  html += '<h3 style="margin:16px 0 8px;font-size:0.95rem;">📋 练习记录</h3>';
  if (progress.quizHistory.length === 0) {
    html += '<div class="empty-state"><p>还没有练习记录，去做几道题吧！</p></div>';
  } else {
    html += '<div class="card" style="padding:0;">';
    [...progress.quizHistory].reverse().slice(0, 20).forEach(h => {
      const d = new Date(h.date);
      const dateStr = d.toLocaleDateString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
      const typeMap = { 'vocab-ja2cn':'词汇日→中', 'vocab-cn2ja':'词汇中→日', 'grammar-fill':'文法释义', 'grammar-particle':'助词选择', 'mixed':'综合' };
      html += `<div class="history-item"><span>${dateStr} · ${typeMap[h.type]||h.type}</span><span style="font-weight:600;">${h.score}/${h.total} (${Math.round(h.score/h.total*100)}%)</span></div>`;
    });
    html += '</div>';
  }
  html += '<button class="reset-btn" onclick="resetProgressAndRender()">⚠️ 重置所有进度</button>';
  html += '</div>';
  $content.innerHTML = html;
}
function resetProgressAndRender() {
  if (confirm('确定要重置所有学习进度吗？此操作不可撤销！')) {
    resetProgress();
    renderProgress();
  }
}

// --- Tab Switching ---
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'vocab') renderVocab();
  else if (tab === 'grammar') renderGrammar();
  else if (tab === 'quiz') renderQuiz();
  else if (tab === 'progress') renderProgress();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});


// --- Speech ---
let speechSynth = window.speechSynthesis;
let speakingBtn = null;
function speakWord(text, btn) {
  if (speechSynth.speaking) { speechSynth.cancel(); }
  if (speakingBtn) { speakingBtn.classList.remove("speaking"); }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ja-JP";
  utter.rate = 0.85;
  utter.onstart = () => { if (btn) { btn.classList.add("speaking"); speakingBtn = btn; } };
  utter.onend = () => { if (btn) { btn.classList.remove("speaking"); speakingBtn = null; } };
  utter.onerror = () => { if (btn) { btn.classList.remove("speaking"); speakingBtn = null; } };
  speechSynth.speak(utter);
}

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    await onAuthenticated();
  } else {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('app-main').style.display = 'none';
  }
}

init();
